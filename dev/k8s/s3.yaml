# Local S3 stand-in: moto's server mode (https://github.com/getmoto/moto).
# Production storage is AWS S3, so locally we want faithful S3 *API* behavior
# (versioning, bucket policy, CORS, presigned URLs), not a storage engine.
# Data is in-memory: it is lost when the pod restarts or on `make dev-reset`.
# Bucket setup happens in scripts/dev/create-bucket.py. No auth is enforced.
apiVersion: v1
kind: Service
metadata:
  name: s3
  namespace: sleeved
spec:
  selector:
    app: s3
  ports:
    - port: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3
  namespace: sleeved
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s3
  template:
    metadata:
      labels:
        app: s3
    spec:
      # Service-link env vars (e.g. S3_PORT=tcp://...) collide with moto's own
      # MOTO_* settings parsing; disable them.
      enableServiceLinks: false
      containers:
        - name: s3
          image: motoserver/moto:5.2.4
          args: ["-H", "0.0.0.0", "-p", "5000"]
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /moto-api/
              port: 5000
            periodSeconds: 3
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
